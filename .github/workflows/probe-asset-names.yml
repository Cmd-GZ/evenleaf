name: 探测 Release 资产名能否用中文

# 一次性排查工具：造一个临时 release，试几种命名方式，打印服务器实际存下的名字，然后删掉。
# 只在手动触发时运行，不影响正常构建。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 造一个测试文件
        run: |
          printf '%%PDF-1.4\n%%probe\n' > sample.pdf
          ls -l sample.pdf

      - name: 试四种命名
        run: |
          set -uo pipefail
          TAG="probe-$(date -u +%Y%m%d%H%M%S)"
          gh release create "$TAG" --title "命名探测 $TAG" --notes "自动清理" >/dev/null
          REL=$(gh release view "$TAG" --json databaseId --jq .databaseId)
          API="https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$REL/assets"
          echo "release id=$REL tag=$TAG"

          try_upload() {  # $1=说明 $2=name 参数
            enc=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "$2")
            code=$(curl -sS -o /tmp/r.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/pdf" --data-binary @sample.pdf "$API?name=$enc")
            got=$(python3 -c 'import json;d=json.load(open("/tmp/r.json"));print(d.get("name",d.get("message","")))' 2>/dev/null || echo '?')
            echo "[$1] 请求名：$2 → HTTP $code，服务器记为：$got"
          }

          try_upload "纯中文无破折号" "月之都测试.pdf"
          try_upload "中文带破折号"   "月之都——测试.pdf"
          try_upload "中文带空格"     "月之都 测试.pdf"
          try_upload "ASCII 对照"     "ascii-sample.pdf"

          echo "---- 当前资产列表 ----"
          gh api "repos/$GITHUB_REPOSITORY/releases/$REL/assets" --paginate --jq '.[].name'

          echo "---- 删除临时 release ----"
          gh release delete "$TAG" --yes --cleanup-tag || true
