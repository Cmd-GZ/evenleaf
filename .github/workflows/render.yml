name: 渲染 PDF

on:
  push:
    branches: [master, main]
    paths:
      - 'books/**/*.tex'
      - 'books/*/build.sh'
      - 'shared/**'
      - 'texmf/**'
      - '.github/workflows/render.yml'
  pull_request:
    paths:
      - 'books/**/*.tex'
      - 'shared/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_TEXDIR: ${{ github.workspace }}/.ci/texlive

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 取缓存（TeX 与字体）
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            .ci/texlive
            .ci/fonts
          key: tex-${{ runner.os }}-${{ hashFiles('.github/workflows/render.yml') }}

      - name: 装系统小工具（每次都装，很快）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends poppler-utils

      - name: 装 TinyTeX（只在缓存未命中时）
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .ci
          # 安装脚本自己读 TINYTEX_DIR（TEXDIR=${TINYTEX_DIR:-~}/.TinyTeX，再 tar -C $(dirname $TEXDIR)），
          # 变量名不能撞，本项目一律用 CI_TEXDIR
          curl -sL "https://yihui.org/tinytex/install-bin-unix.sh" | sh
          ORIG="$HOME/.TinyTeX/bin/x86_64-linux"
          # 用集合而不是逐个点名：单个宏包名常常「不在仓库里」——amssymb 在 amsfonts，array/calc/
          # longtable/tabularx 在 tools，perpage 在 bigfoot，titletoc 在 titlesec 的包里。
          PKGS="xetex ctex fandol collection-langchinese collection-latexrecommended \
            collection-latexextra collection-pictures collection-fontsrecommended"
          if ! "$ORIG/tlmgr" install $PKGS > /tmp/tlmgr.log 2>&1; then
            echo "---- tlmgr 失败，摘要 ----"
            grep -E "not present in repository|cannot be found|older than remote|Cross release|^! " /tmp/tlmgr.log | head -10 || true
            echo "---- 末尾 20 行 ----"
            tail -20 /tmp/tlmgr.log || true
            echo "::error::宏包安装失败"; exit 1
          fi
          for sty in ctex.sty xeCJK.sty pgfplots.sty footmisc.sty perpage.sty titlesec.sty \
                     booktabs.sty tcolorbox.sty enumitem.sty caption.sty; do
            "$ORIG/kpsewhich" "$sty" >/dev/null || { echo "::error::缺 $sty"; exit 1; }
          done
          mkdir -p "$CI_TEXDIR"
          cp -a "$HOME/.TinyTeX/." "$CI_TEXDIR/"

      - name: 装字体（只在缓存未命中时）
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          MONO_FONT_URL: ${{ vars.MONO_FONT_URL }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            fonts-noto-core fonts-noto-cjk fonts-noto-cjk-extra unzip curl
          mkdir -p .ci/fonts/noto .ci/fonts/mono
          cp -a /usr/share/fonts/truetype/noto/. .ci/fonts/noto/
          cp -a /usr/share/fonts/opentype/noto/. .ci/fonts/noto/
          URL="${MONO_FONT_URL:-https://github.com/SpaceTimee/Fusion-JetBrainsMapleMono/releases/latest/download/JetBrainsMapleMono-XX-XX-XX-XX.zip}"
          curl -fL --retry 3 -o /tmp/mono.zip "$URL"
          unzip -o -q /tmp/mono.zip -d .ci/fonts/mono/

      - name: 挂上 TeX 与字体
        run: |
          set -euo pipefail
          # TinyTeX 进 PATH
          echo "$CI_TEXDIR/bin/x86_64-linux" >> "$GITHUB_PATH"
          # 字体装到用户目录
          mkdir -p "$HOME/.local/share/fonts"
          cp -a .ci/fonts/noto/. "$HOME/.local/share/fonts/" 2>/dev/null || true
          cp -a .ci/fonts/mono/. "$HOME/.local/share/fonts/" 2>/dev/null || true
          # 基座写死 Path=/usr/share/fonts/noto/，这里指过去
          sudo mkdir -p /usr/share/fonts
          sudo rm -rf /usr/share/fonts/noto
          sudo ln -s "$HOME/.local/share/fonts" /usr/share/fonts/noto
          fc-cache -f >/dev/null

      - name: 自检（字体 + TeX）
        run: |
          set -euo pipefail
          export PATH="$CI_TEXDIR/bin/x86_64-linux:$PATH"
          xelatex --version | head -1
          fail=0
          for f in "NotoSerif" "NotoSans" "JetBrains Maple Mono" "Noto Serif CJK SC" "Noto Sans CJK SC" "Noto Sans Mono CJK SC"; do
            got=$(fc-match -f '%{family[0]}' "$f")
            printf '%-26s → %s\n' "$f" "$got"
            case "$got" in *Noto*|*JetBrains*) ;; *) echo "::error::字体缺失：$f"; fail=1 ;; esac
          done
          [ -f /usr/share/fonts/noto/NotoSerif-Regular.ttf ] || { echo "::error::/usr/share/fonts/noto/NotoSerif-Regular.ttf 不在"; fail=1; }
          kpsewhich ctex.sty >/dev/null || { echo "::error::ctex.sty 缺失"; fail=1; }
          exit "$fail"

      - name: 编译三本书
        run: |
          set -euo pipefail
          export PATH="$CI_TEXDIR/bin/x86_64-linux:$PATH"
          for dir in warthunder guanghan mooncity; do
            echo "==== $dir ===="
            ( cd "books/$dir" && ./build.sh )
          done

      - name: 校验日志
        run: |
          set -euo pipefail
          fail=0
          for dir in warthunder guanghan mooncity; do
            log="books/$dir/build.log"
            [ -f "$log" ] || { echo "缺少 $log" >&2; fail=1; continue; }
            err=$(grep -c '^!' "$log" || true)
            unres=$(grep -c 'undefined references' "$log" || true)
            miss=$(grep -c 'Missing character' "$log" || true)
            echo "$dir：错误 $err，未解析引用 $unres，缺字 $miss"
            [ "$err" -eq 0 ] || fail=1
            [ "$unres" -eq 0 ] || fail=1
            [ "$miss" -eq 0 ] || fail=1
          done
          exit "$fail"

      - name: 上传 PDF
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: |
            books/*/*.pdf
            !books/*/main.pdf
          if-no-files-found: error

      - name: 发布到 Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .release
          cp "books/warthunder/战争的雷霆——记一种可能的中国历史.pdf" .release/warthunder.pdf
          cp "books/guanghan/月之都——广寒宫残简辑佚与考释.pdf"     .release/guanghan.pdf
          cp "books/mooncity/月之都——记一个不想变化的文明.pdf"     .release/mooncity.pdf

          pages() { pdfinfo "$1" | awk '/^Pages/{print $2}'; }
          NOTES=$(printf '源码 %s 自动编译。\n\n| 卷 | 页数 |\n|---|---|\n| 战争的雷霆 | %s |\n| 广寒宫残简 | %s |\n| 月之都 | %s |' \
            "$(git rev-parse --short HEAD)" \
            "$(pages .release/warthunder.pdf)" \
            "$(pages .release/guanghan.pdf)" \
            "$(pages .release/mooncity.pdf)")

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --notes "$NOTES"
          else
            gh release create latest --title "最新构建" --target "$GITHUB_SHA" --notes "$NOTES" --latest
          fi
          gh release upload latest .release/*.pdf --clobber
          gh release edit latest --latest
          gh release view latest --json url --jq .url
