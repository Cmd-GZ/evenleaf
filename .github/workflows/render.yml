name: 渲染 PDF

on:
  push:
    branches: [master, main]
    paths:
      - 'books/**/*.tex'
      - 'books/*/build.sh'
      - 'shared/**'
      - 'texmf/**'
      - '.github/workflows/render.yml'
  pull_request:
    paths:
      - 'books/**/*.tex'
      - 'shared/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_TEXDIR: ${{ github.workspace }}/.ci/texlive

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 取缓存（TeX）
        id: cache_tex
        uses: actions/cache/restore@v4
        with:
          path: .ci/texlive
          key: texlive-${{ runner.os }}-v1

      - name: 取缓存（字体）
        id: cache_fonts
        uses: actions/cache/restore@v4
        with:
          path: .ci/fonts
          key: fonts-${{ runner.os }}-v1

      - name: 装系统小工具（每次都装，很快）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends poppler-utils

      - name: 装 TinyTeX（只在缓存未命中时）
        if: steps.cache_tex.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .ci
          # 安装脚本自己读 TINYTEX_DIR（TEXDIR=${TINYTEX_DIR:-~}/.TinyTeX，再 tar -C $(dirname $TEXDIR)），
          # 变量名不能撞，本项目一律用 CI_TEXDIR
          curl -sL "https://yihui.org/tinytex/install-bin-unix.sh" | sh
          ORIG="$HOME/.TinyTeX/bin/x86_64-linux"
          # 用集合而不是逐个点名：单个宏包名常常「不在仓库里」——amssymb 在 amsfonts，array/calc/
          # longtable/tabularx 在 tools，perpage 在 bigfoot，titletoc 在 titlesec 的包里。
          PKGS="xetex ctex fandol collection-langchinese collection-latexrecommended \
            collection-latexextra collection-pictures collection-fontsrecommended"
          if ! "$ORIG/tlmgr" install $PKGS > /tmp/tlmgr.log 2>&1; then
            echo "---- tlmgr 失败，摘要 ----"
            grep -E "not present in repository|cannot be found|older than remote|Cross release|^! " /tmp/tlmgr.log | head -10 || true
            echo "---- 末尾 20 行 ----"
            tail -20 /tmp/tlmgr.log || true
            echo "::error::宏包安装失败"; exit 1
          fi
          for sty in ctex.sty xeCJK.sty pgfplots.sty footmisc.sty perpage.sty titlesec.sty \
                     booktabs.sty tcolorbox.sty enumitem.sty caption.sty; do
            "$ORIG/kpsewhich" "$sty" >/dev/null || { echo "::error::缺 $sty"; exit 1; }
          done
          mkdir -p "$CI_TEXDIR"
          cp -a "$HOME/.TinyTeX/." "$CI_TEXDIR/"

      - name: 装字体（只在缓存未命中时）
        if: steps.cache_fonts.outputs.cache-hit != 'true'
        env:
          MONO_FONT_URL: ${{ vars.MONO_FONT_URL }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            fonts-noto-core fonts-noto-cjk fonts-noto-cjk-extra unzip curl
          mkdir -p .ci/fonts/noto .ci/fonts/mono
          cp -a /usr/share/fonts/truetype/noto/. .ci/fonts/noto/
          cp -a /usr/share/fonts/opentype/noto/. .ci/fonts/noto/
          URL="${MONO_FONT_URL:-https://github.com/SpaceTimee/Fusion-JetBrainsMapleMono/releases/latest/download/JetBrainsMapleMono-XX-XX-XX-XX.zip}"
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 -o /tmp/mono.zip "$URL"
          unzip -o -q /tmp/mono.zip -d .ci/fonts/mono/

      - name: 存缓存（TeX）
        if: always() && steps.cache_tex.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci/texlive
          key: texlive-${{ runner.os }}-v1

      - name: 存缓存（字体）
        if: always() && steps.cache_fonts.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci/fonts
          key: fonts-${{ runner.os }}-v1

      - name: 挂上 TeX 与字体
        run: |
          set -euo pipefail
          # TinyTeX 进 PATH
          echo "$CI_TEXDIR/bin/x86_64-linux" >> "$GITHUB_PATH"
          # 字体装到用户目录
          mkdir -p "$HOME/.local/share/fonts"
          cp -a .ci/fonts/noto/. "$HOME/.local/share/fonts/" 2>/dev/null || true
          cp -a .ci/fonts/mono/. "$HOME/.local/share/fonts/" 2>/dev/null || true
          # 基座写死 Path=/usr/share/fonts/noto/，这里指过去
          sudo mkdir -p /usr/share/fonts
          sudo rm -rf /usr/share/fonts/noto
          sudo ln -s "$HOME/.local/share/fonts" /usr/share/fonts/noto
          fc-cache -f >/dev/null

      - name: 自检（字体 + TeX）
        run: |
          set -euo pipefail
          export PATH="$CI_TEXDIR/bin/x86_64-linux:$PATH"
          xelatex --version 2>&1 | sed -n 1p || true
          fail=0
          for f in "NotoSerif" "NotoSans" "JetBrains Maple Mono" "Noto Serif CJK SC" "Noto Sans CJK SC" "Noto Sans Mono CJK SC"; do
            got=$(fc-match -f '%{family[0]}' "$f")
            printf '%-26s → %s\n' "$f" "$got"
            case "$got" in *Noto*|*JetBrains*) ;; *) echo "::error::字体缺失：$f"; fail=1 ;; esac
          done
          [ -f /usr/share/fonts/noto/NotoSerif-Regular.ttf ] || { echo "::error::/usr/share/fonts/noto/NotoSerif-Regular.ttf 不在"; fail=1; }
          kpsewhich ctex.sty >/dev/null || { echo "::error::ctex.sty 缺失"; fail=1; }
          exit "$fail"

      - name: 编译各卷
        run: |
          set -euo pipefail
          export PATH="$CI_TEXDIR/bin/x86_64-linux:$PATH"
          shopt -s nullglob
          built=0
          for d in books/*/; do
            [ -f "$d/build.sh" ] || continue
            name=$(basename "$d")
            echo "==== $name ===="
            ( cd "$d" && ./build.sh )
            built=$((built+1))
          done
          if [ "$built" -eq 0 ]; then
            echo "::error::books/ 下没有找到任何含 build.sh 的书目"; exit 1
          fi
          echo "共编译 $built 卷"

      - name: 校验日志
        run: |
          set -euo pipefail
          shopt -s nullglob
          fail=0; n=0
          for d in books/*/; do
            [ -f "$d/build.log" ] || continue
            n=$((n+1)); name=$(basename "$d"); log="$d/build.log"
            err=$(grep -c '^!' "$log" || true)
            unres=$(grep -c 'undefined references' "$log" || true)
            miss=$(grep -c 'Missing character' "$log" || true)
            echo "$name：错误 $err，未解析引用 $unres，缺字 $miss"
            [ "$err" -eq 0 ] || fail=1
            [ "$unres" -eq 0 ] || fail=1
            [ "$miss" -eq 0 ] || fail=1
          done
          [ "$n" -gt 0 ] || { echo "::error::没有找到 build.log"; exit 1; }
          exit "$fail"

      - name: 上传 PDF
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: |
            books/*/*.pdf
            !books/*/main.pdf
          if-no-files-found: error

      - name: 发布到 Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          shopt -s nullglob
          gh --version 2>&1 | sed -n 1p || true
          mkdir -p .release
          SHA=$(git rev-parse --short HEAD)
          pages() { pdfinfo "$1" | awk '/^Pages/{print $2}'; }

          # 每卷取 build.sh 产出的分发 PDF（排除工作副本 main.pdf），资产沿用书籍自身的文件名
          rows=""
          for d in books/*/; do
            [ -f "$d/build.sh" ] || continue
            name=$(basename "$d")
            dist=""
            for f in "$d"*.pdf; do
              case "$f" in */main.pdf) continue;; esac
              dist="$f"
            done
            if [ -z "$dist" ]; then
              echo "::error::$name 没有产出分发 PDF"; exit 1
            fi
            cp "$dist" ".release/$name.pdf"
            rows="$rows| $(basename "$dist") | $(pages "$dist") |\n"
          done

          NOTES=$(printf '源码 `%s`（%s）自动编译。\n\n| 资产 | 页数 |\n|---|---|\n%b' "$SHA" "$(date -u '+%Y-%m-%d %H:%M UTC')" "$rows")

          # 每次构建一个独立 release：标签带日期与提交号，历史随时可取
          DATE=$(date -u '+%Y-%m-%d')
          TAG="build-${DATE}-${SHA}"
          TITLE="构建 ${DATE} · ${SHA}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            if ! out=$(gh release create "$TAG" --title "$TITLE" --target "$GITHUB_SHA" --latest --notes "$NOTES" 2>&1); then
              echo "::error::gh release create 失败"
              printf '%s\n' "$out" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
          # gh release upload 对非 ASCII 文件名会 404；改用 uploads 接口直接 POST，
          # 文件名由 python 做百分号编码，失败时打印返回体。
          REL_ID=$(gh release view "$TAG" --json databaseId --jq .databaseId)
          API="https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$REL_ID/assets"

          # 同一提交重跑时，先清掉该 release 上已有的资产，避免 422 already_exists
          for aid in $(gh api "repos/$GITHUB_REPOSITORY/releases/$REL_ID/assets" --paginate --jq '.[].id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$aid" >/dev/null || true
          done
          # GitHub 的资产名只接受 ASCII：非 ASCII 名会被落成 default.pdf（PATCH 也一样，
          # 改名后 name 仍是 default.pdf，第二次再改就 422 already_exists）。
          # 因此资产用目录名，中文书名放进发布说明与资产 label。
          for d in books/*/; do
            [ -f "$d/build.sh" ] || continue
            dir=$(basename "$d")
            src=""
            for f in "$d"*.pdf; do
              case "$f" in */main.pdf) continue;; esac
              src="$f"
            done
            [ -n "$src" ] || { echo "::error::$dir 无分发 PDF"; exit 1; }
            code=$(curl -sS --retry 3 --retry-delay 3 -o /tmp/up.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/pdf" \
              --data-binary @"$src" "$API?name=$dir.pdf")
            if [ "$code" != "201" ]; then
              echo "::error::上传 $dir.pdf 失败（HTTP $code）"; head -c 300 /tmp/up.json; echo; exit 1
            fi
            aid=$(gh api "repos/$GITHUB_REPOSITORY/releases/$REL_ID/assets" --paginate \
                    --jq "first(.[] | select(.name==\"$dir.pdf\") | .id) // empty")
            # label 里写中文书名；失败不影响下载
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$aid" \
              -f label="$(basename "$src" .pdf)" >/dev/null 2>&1 || true
            echo "已上传 $dir.pdf"
          done

          # 新建的 release 天然成为 latest，不依赖 gh 的 --latest 开关（旧版本 gh 无此参数）

          # 迁移遗留：早先那个滚动标签，清掉一次即可
          if gh release view latest >/dev/null 2>&1; then
            echo "清理遗留的滚动 release：latest"
            gh release delete latest --yes --cleanup-tag || echo "（清理失败，忽略）"
          fi

          gh release view "$TAG" --json tagName,url --jq '.tagName + "  " + .url'
